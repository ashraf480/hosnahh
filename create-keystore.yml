name: إنشاء مفتاح التوقيع

# يُشغَّل مرة واحدة فقط من تبويب Actions. ينتج ملفًا فيه المفتاح وكلمات المرور.
# بعدها تحمّل الملف، تحفظ نسخة آمنة، وتنسخ القيم إلى Secrets، ثم تحذف الـ artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: توليد المفتاح
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore asma-release.jks -alias asma -keyalg RSA -keysize 4096 \
            -validity 36500 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Asma Allah Al-Husna, O=Asma, C=EG"
          mkdir out
          mv asma-release.jks out/
          base64 -w0 out/asma-release.jks > out/KEYSTORE_BASE64.txt
          {
            echo "أضف هذه الأسرار في: Settings > Secrets and variables > Actions"
            echo
            echo "KEYSTORE_BASE64   = (محتوى الملف KEYSTORE_BASE64.txt كاملًا)"
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_ALIAS         = asma"
            echo "KEY_PASSWORD      = $PASS"
          } > out/اقرأني.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key-SAVE-THIS
          path: out
          retention-days: 1
