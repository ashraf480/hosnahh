name: بناء ملف APK

# يعمل عند رفع وسم إصدار مثل v1.0.0، أو يدويًا من تبويب Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "رقم الإصدار الظاهر (مثال 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write   # لإرفاق الـ APK بصفحة الإصدار

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: التحقق من أسرار التوقيع
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KK: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ] || [ -z "$KA" ] || [ -z "$KK" ]; then
            echo "::error title=مفتاح التوقيع ناقص::أضف الأسرار KEYSTORE_BASE64 و KEYSTORE_PASSWORD و KEY_ALIAS و KEY_PASSWORD. شغّل أولًا سير العمل «إنشاء مفتاح التوقيع» ثم اتبع README."
            exit 1
          fi

      - name: تحديد رقم الإصدار
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$INPUT_VERSION"
          fi
          NAME="${NAME:-1.0.0}"
          if ! [[ "$NAME" =~ ^[0-9]+(\.[0-9]+){0,2}([-.][0-9A-Za-z]+)?$ ]]; then
            echo "::error::رقم الإصدار غير صالح: $NAME"; exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # رقم الإصدار الداخلي يجب أن يزيد مع كل بناء
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: تثبيت الحزم وبناء الخطوط
        run: |
          npm install --no-audit --no-fund
          npm run fonts

      - name: توليد مشروع الأندرويد
        run: |
          npx cap add android
          VERSION_NAME="${{ steps.ver.outputs.name }}" VERSION_CODE="${{ steps.ver.outputs.code }}" python3 scripts/patch-android.py
          npx cap sync android

      - name: فكّ مفتاح التوقيع
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: بناء الإصدار الموقّع
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: تجهيز الملف والتحقق من التوقيع
        id: out
        run: |
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          OUT="Asma-Allah-Husna-${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.file }}
          path: |
            ${{ steps.out.outputs.file }}
            ${{ steps.out.outputs.file }}.sha256

      - name: إرفاق الملف بصفحة الإصدار
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.out.outputs.file }}
            ${{ steps.out.outputs.file }}.sha256
